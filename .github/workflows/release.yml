# Builds MoM for macOS and Windows and publishes both to a GitHub release.
# Trigger it by pushing a version tag:  npm version minor && git push --follow-tags
#
# The release holds only what people download (two DMGs and the Windows installer) plus latest.yml and
# latest-mac.yml, which installed copies of MoM read to find new versions. Without those two files nobody
# gets the update. Students see the bullets from build/release-notes.md, in the app and on the release page.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            files: |
              dist.nosync/*.dmg
              dist.nosync/latest-mac.yml
          - os: windows-latest
            command: npm run dist:win
            files: |
              dist.nosync/*.exe
              dist.nosync/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The updater looks for the files under the tag v<package.json version>, so the two must match.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mom-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # A download table first, so nobody has to work out which file in the list is theirs.
      - name: Write the release page
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo "## Download"
            echo
            echo "| Your computer | Download |"
            echo "|---|---|"
            echo "| 🍎 **Mac with Apple silicon** (M1, M2, M3, M4…) | [**MoM-mac-arm64.dmg**](${base}/MoM-mac-arm64.dmg) |"
            echo "| 🍎 **Mac with Intel** | [**MoM-mac-x64.dmg**](${base}/MoM-mac-x64.dmg) |"
            echo "| 🪟 **Windows 10 / 11** | [**MoM-Setup.exe**](${base}/MoM-Setup.exe) |"
            echo
            echo "Not sure which Mac you have? Apple menu → **About This Mac**: \"Chip: Apple M…\" means Apple silicon, \"Processor: Intel\" means Intel."
            echo
            echo "The first time you open MoM, your computer will warn you because it isn't from a paid developer account. [Here's how to open it](https://github.com/${GITHUB_REPOSITORY}#download)."
            echo
            echo "The other files below are for MoM's automatic updates; you don't need them."
            echo
            echo "## What's new"
            echo
            grep -v '^<!--\|^     ' build/release-notes.md
          } > release-body.md
          cat release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-body.md
