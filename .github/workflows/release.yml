# Builds MoM for macOS and Windows and publishes both to a GitHub release.
# Trigger it by pushing a version tag:  npm version minor && git push --follow-tags
#
# Installed copies of MoM find new versions through the latest.yml / latest-mac.yml files uploaded here,
# and show students the bullets from build/release-notes.md. Without those files nobody gets the update.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            files: |
              dist.nosync/*.dmg
              dist.nosync/*.zip
              dist.nosync/*.blockmap
              dist.nosync/latest-mac.yml
          - os: windows-latest
            command: npm run dist:win
            files: |
              dist.nosync/*.exe
              dist.nosync/*.blockmap
              dist.nosync/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The updater looks for the files under the tag v<package.json version>, so the two must match.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mom-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: build/release-notes.md
